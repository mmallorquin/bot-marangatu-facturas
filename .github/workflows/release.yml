# Cada merge a main: corre los tests, compila el bot y el comando de métricas para Linux
# y los publica como Release. El servidor los baja solo (scripts/actualizar-servidor.sh).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # crear el Release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tests
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "Correr gofmt"; exit 1; }
          go vet ./...
          go test -race ./...

      - name: Compilar para Linux
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            for cmd in bot metricas; do
              GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" \
                -o "dist/$cmd-linux-$arch" "./cmd/$cmd"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Compilado automáticamente desde ${GITHUB_SHA::7}: $(git log -1 --format=%s)"
